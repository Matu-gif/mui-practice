name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v6
      - name: Node.js を準備
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: 依存関係をインストール
        run: npm ci
      - name: Vite をビルド
        run: npm run build
      - name: 公開ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v4
